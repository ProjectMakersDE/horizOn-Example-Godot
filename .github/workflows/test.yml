name: Game and SDK Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false
      - name: Run isolated gameplay and loopback transport tests
        env:
          GODOT_BIN: godot
        run: python3 tests/run_checks.py
